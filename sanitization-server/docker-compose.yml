version: '3.8'

services:
  netassist-sanitizer:
    build: .
    container_name: netassist-sanitizer
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
      - SESSION_CLEANUP_INTERVAL=3600
    volumes:
      # Optional: Mount for persistent session storage
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

