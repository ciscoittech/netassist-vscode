name: NetAssist CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-extension:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint TypeScript
      run: npm run lint

    - name: Compile TypeScript
      run: npm run compile

    - name: Run extension tests
      run: npm test

  test-sanitization-server:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        cd sanitization-server
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run sanitization tests
      run: |
        cd sanitization-server
        python simple_test.py

    - name: Run pytest
      run: |
        cd sanitization-server
        python -m pytest test_sanitizer.py -v --tb=short

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security scan
      uses: securecodewarrior/github-action-add-sarif@v1
      with:
        sarif-file: 'security-scan-results.sarif'

    - name: Check for sensitive data
      run: |
        # Check for potential API keys, IPs, credentials
        if grep -r "sk-" . --exclude-dir=node_modules --exclude-dir=.git; then
          echo "❌ Potential API keys found"
          exit 1
        fi

        if grep -r "192\.168\." . --exclude-dir=node_modules --exclude-dir=.git --exclude="*.md"; then
          echo "❌ Real IP addresses found in code"
          exit 1
        fi

        echo "✅ No sensitive data detected"

  build-extension:
    runs-on: ubuntu-latest
    needs: [test-extension, test-sanitization-server]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build extension
      run: npm run vscode:prepublish

    - name: Package extension
      run: |
        npm install -g vsce
        vsce package

    - name: Upload extension artifact
      uses: actions/upload-artifact@v3
      with:
        name: netassist-extension
        path: '*.vsix'

  docker-build:
    runs-on: ubuntu-latest
    needs: test-sanitization-server

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        cd sanitization-server
        docker build -t netassist-sanitizer:latest .

    - name: Test Docker image
      run: |
        cd sanitization-server
        docker run -d --name test-sanitizer -p 8000:8000 netassist-sanitizer:latest
        sleep 10
        curl -f http://localhost:8000/api/health || exit 1
        docker stop test-sanitizer

  release:
    runs-on: ubuntu-latest
    needs: [build-extension, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download extension artifact
      uses: actions/download-artifact@v3
      with:
        name: netassist-extension

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: NetAssist ${{ github.ref }}
        draft: false
        prerelease: false